{% extends "base.html" %}
{% block title %}Deposit — NexusBank{% endblock %}
{% block content %}
<div style="max-width:520px;margin:0 auto">
  <div class="section-title">💰 Deposit Money</div>
  <p class="section-sub">Add funds to your NexusBank account</p>
  <div class="card">
    <form method="POST">
      <div class="fg"><label class="fl">Amount (₹) *</label><input class="fi" name="amount" type="number" min="1" step="0.01" placeholder="Enter amount" style="font-size:1.1rem" required/></div>
      <div class="fg"><label class="fl">Category</label>
        <select class="fi" name="category">
          <option value="Credit">General Credit</option>
          <option value="Salary">Salary</option>
          <option value="Business">Business Income</option>
          <option value="Gift">Gift / Bonus</option>
          <option value="Refund">Refund</option>
        </select>
      </div>
      <div class="fg" style="margin-bottom:1.75rem"><label class="fl">Description</label><input class="fi" name="description" type="text" placeholder="e.g. Monthly salary credit..."/></div>
      <button type="submit" class="btn btn-primary btn-full" style="padding:.95rem">Deposit Now →</button>
    </form>
  </div>
  <a href="{{ url_for('dashboard') }}" class="btn btn-ghost btn-full mt">← Back to Dashboard</a>
</div>
{% endblock %}
